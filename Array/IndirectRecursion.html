<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indirect Recursion</title>
</head>

<body>
    <script>
        let monay = 100
        let totalApple = 0

        function buyApple(x) { //Indirect Reacursion
            // console.log(x)
            if (x > 0) {
                console.log(`I have ${x} RS Appls ${totalApple}`)
                buyMore(x)
            } else (
                console.log(`I don't have more monay but have Appls ${totalApple}`)
            )
        }

        function buyMore(x) {
            totalApple++
            buyApple(x - 10)
        }

        buyApple(monay)

        //     )

        // }
        // buyApple(monay)

        function test(x) {
            // console.log(x)
            if (x > 0) {
                test(x - 1)
            }
            console.log(x)
        }
        test(5)
    </script>
</body>

</html>
