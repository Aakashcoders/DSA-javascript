<body>
    <script>
        let data1 = [5, 8, 4, 9, 6, 10, 3, 12]
        let data2 = [11, 7, 13, 2, 1]
        let data3 = []
        let d1 = 0
        let d2 = 0
        let d3 = 0

        while (d1 < data1.length && d2 < data2.length) {
            if (data1[d1] < data2[d2]) {
                data3[d3] = data1[d1]
                d1++

            } else {
                data3[d3] = data2[d2]
                d2++
            }
            d3++
        }
        console.log(data3)

        while (d2 < data2.length) {
            data3[d3] = data2[d2]
            d3++
            d2++
        }
        console.log(data3)

    </script>
