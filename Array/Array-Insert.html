        function insertEl() {
            let arr = [10, 20, 30, 40, 50, 60, 70]
            let newEle = document.querySelector("#newelement").value
            let position = document.querySelector("#position").value
            let Newnum = Number.parseInt(newEle)
            let Positionnum = Number.parseInt(position)
            console.log(arr)
            for (i = arr.length - 1; i >= 0; i--) {
                if (i >= Positionnum && Positionnum <= arr.length && !isNaN(Positionnum)) {
                    arr[i + 1] = arr[i]
                    if (i == Positionnum) {

                    }

            }
